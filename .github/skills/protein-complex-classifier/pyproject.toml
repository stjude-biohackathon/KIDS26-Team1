[project]
name = "protein-complex-classifier"
version = "1.0.0"
description = "Protein-complex interaction classifier: ESM-C/ProtT5/ProteomeLM/ProteinBERT embeddings + biological features + ensemble ML classifier."
requires-python = "==3.13.*"
readme = "SKILL.md"

# Pinned to the EXACT versions validated end-to-end for this skill (embedding
# generation, biological feature extraction, and classifier training/prediction).
# Do not loosen these to ">=" for a shipped/reproducible environment — use
# `uv sync` (which respects uv.lock) rather than `uv add` so a fresh install
# resolves to identical versions, not just compatible ones.
dependencies = [
    # ── Core scientific stack ──
    "numpy==2.3.5",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "requests==2.34.2",
    "joblib==1.5.3",
    "imbalanced-learn==0.14.2",

    # ── PyTorch (CPU; for GPU replace with the appropriate CUDA build) ──
    "torch==2.11.0",

    # ── HuggingFace ecosystem ──
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
    "accelerate==1.14.0",
    "sentencepiece==0.2.2",
    "tokenizers==0.22.2",
    "protobuf==7.36.0",

    # ── ESM-C 600M (EvolutionaryScale) runtime deps ──
    # The `esm` package itself is installed separately (--no-deps; see
    # scripts/setup.sh) because it declares `torchtext`/`torchvision`, which
    # have no wheels for this Python version and are NOT needed for ESM-C
    # embedding generation. These are esm's actual transitive imports:
    "einops==0.8.2",
    "biopython==1.88",
    "biotite==1.7.1",
    "brotli==1.2.0",
    "zstd==1.5.7.2",
    "tenacity==9.1.4",
    "cloudpathlib==0.25.0",
    "msgpack-numpy==0.4.8",
    "httpx==0.28.1",

    # ── GO/domain/PPI feature extraction ──
    "bioservices==1.16.0",
]
